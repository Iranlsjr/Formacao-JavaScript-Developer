<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/profile/profile.css" />
    <link rel="stylesheet" href="assets/css/profile/profile-responsive.css" />
    <script
      src="https://kit.fontawesome.com/c954e94200.js"
      crossorigin="anonymous"
    ></script>

    <title>ORKUT</title>
  </head>
  <body>
    <header class="menu orkut-button-bg">
      <nav>
        <div id="title">
            <h1>ORKUT</h1>
        </div>
        <div id="menu-hamburger">
            <label for="">&#9776;</label>
        </div>
      </nav>
    </header>

    <main class="container">
      <aside class="photo">
        <div class="photo__avatar">
          <img
            src="assets/img/avatar.jpg"
            height="250px"
            width="250px"
            alt=""
          />
        </div>
        <div class="photo__name">
          <h1 class="orkut-font-color">Iran</h1>
        </div>
        <div class="photo__tools">
          <div class="photo__tools__messages">
            <i class="fa-solid fa-message orkut-font-default"></i>
            <a href="#" class="orkut-link">SCRAPS</a>
          </div>
          <div class="photo__tools__edit">
            <i class="fa-solid fa-pen orkut-font-default"></i>
            <a href="#" class="orkut-link">EDITAR PERIL</a>
          </div>
          <div class="photo__tools__gallery">
            <i class="fa-solid fa-camera orkut-font-default"></i>
            <a href="#" class="orkut-link">ALBUNS</a>
          </div>
          <div class="photo__tools__depositons">
            <i class="fa-solid fa-sun orkut-font-default"></i>
            <a href="#" class="orkut-link">DEPOIMENTOS</a>
          </div>
        </div>
      </aside>
      <section class="description">Sou descripton</section>
      <aside class="counter">
        <div class="counter__friend">sou count friend</div>
        <div class="counter__community">Sou count community</div>
      </aside>
    </main>
  </body>
</html>

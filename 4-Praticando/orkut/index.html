<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/login/login.css">
    <link rel="stylesheet" href="assets/css/login/login-responsive.css">
    <title>ORKUT</title>
</head>
<body>
    <div class="logo">
        <img src="assets/img/Logo_ORKUT.png" alt="">
    </div>

    <div class="container">
        <div class="fields">

            <div class="fields__title">
                <p id="field___title">Acesse o <span class="orkut-font-color">orkut</span> com a sua conta 
                    <span style="color: #7447bc;">G</span><span style="color: #E8258E;">o</span><span style="color: #ddac09;">o</span><span style="color: #0404b0;">g</span><span style="color: #5d5f60;">l</span><span style="color: #d11616;">e</span>!
                </p>
            </div>

            <div class="fields__textboxs">
                <input type="email" name="" id="field___email" placeholder="E-mail ou número de celular">
                <input type="password" name="" id="field___password" placeholder="Senha">
            </div>

            <div class="fields__remember">
                <input type="checkbox" name="" id="field___remember">
                <label for="field___remember">Lembrar sempre do meu acesso</label>
            </div>

            <div class="fields___button">
                <button id="btnlogin" class="orkut-button-bg">ENTRAR</button>
            </div>

            <div class="fields__recovery">
                <a href="#">Esqueci senha ou e-mail</a>
            </div>

            <div class="fields__create">
                <a href="#">Não tem conta? <span class="orkut-font-color">Criar agora</span></a>
            </div>
        </div>
    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub - Finder</title>
    <link
      rel="shortcut icon"
      href="https://www.github.com/github.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <header>
      <h1>
        GitHub
        <span>Finder</span>
      </h1>
      <div class="search-container">
        <input
          type="text"
          class="query"
          value=""
          placeholder="Enter a username"
        />
        <button type="button" onclick="getUser()">
          <span class="material-icons-outline">Search</span>
        </button>
      </div>
    </header>

    <main id="user-info">
    </main>

    <script src="assets/finder.js"></script>
  </body>
</html>
